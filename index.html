<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TECH LAB · 跑酷</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Microsoft YaHei;-webkit-tap-highlight-color: transparent;}
body{background:#0a0e27;color:#fff;text-align:center;overflow-x:hidden}
nav{
    width:100%;height:70px;
    background:rgba(10,14,39,0.85);
    border-bottom:1px solid rgba(99,102,241,0.3);
    display:flex;justify-content:space-between;align-items:center;
    padding:0 5%;
}
.logo{font-size:24px;font-weight:bold}
nav a{color:#aeb7df;text-decoration:none}
.canvas-wrap{
    position:relative;
    max-width:700px;
    margin:20px auto 0;
    padding:0 10px;
}
#gameCanvas{
    border:2px solid #6366f1;
    border-radius:8px;
    width:100%;
    height:auto;
}
.start-canvas-btn{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    padding:14px 40px;
    border-radius:30px;
    background:linear-gradient(135deg,#34d399,#10b981);
    color:#fff;
    border:none;
    font-size:18px;
    cursor:pointer;
    box-shadow: 0 0 24px #10b98166;
    transition:0.25s;
}
.start-canvas-btn:hover{
    transform:translate(-50%,-50%) translateY(-3px);
    box-shadow: 0 0 34px #10b98199;
}
.tip{color:#c3c9f0;font-size:14px;margin-bottom:16px;padding:0 10px;}
.btn-group{
    display:flex;
    gap:16px;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:20px;
    padding:0 10px;
}
.back,.restart{
    padding:12px 32px;border-radius:30px;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    color:#fff;text-decoration:none;
    border:none;
    font-size:16px;
    cursor:pointer;
}
.restart{
    background:linear-gradient(135deg,#06b6d4,#22d3ee);
}
/* 手机虚拟按键布局 */
.mobile-ctrl{
    display:none;
    width:100%;
    max-width:700px;
    margin:0 auto 20px;
    padding:0 20px;
    justify-content:space-between;
    align-items:center;
}
.left-group{
    display:flex;
    gap:12px;
}
.ctrl-btn{
    width:80px;height:80px;
    border-radius:50%;
    background:rgba(99,102,241,0.35);
    border:2px solid #6366f1;
    color:#fff;
    font-size:26px;
    display:flex;align-items:center;justify-content:center;
    user-select:none;
}
.jump-btn{
    width:90px;height:90px;
    border-radius:50%;
    background:rgba(52,211,153,0.35);
    border:2px solid #34d399;
    color:#fff;
    font-size:22px;
    display:flex;align-items:center;justify-content:center;
    user-select:none;
}
@media(max-width:768px){
    .mobile-ctrl{display:flex;}
    .ctrl-btn{width:70px;height:70px;font-size:22px;}
    .jump-btn{width:80px;height:80px;font-size:20px;}
}
</style>
</head>
<body>
<nav>
    <div class="logo">TECH LAB</div>
    <div><a href="https://facaifu.github.io/">返回首页</a></div>
</nav>

<div class="canvas-wrap">
    <canvas id="gameCanvas" width="700" height="280"></canvas>
    <button class="start-canvas-btn" id="startBtn">开始游戏</button>
</div>

<div class="tip">空格 / 点击画面跳跃 | A D 左右移动（手机可使用下方按键）</div>

<div class="mobile-ctrl">
    <div class="left-group">
        <div class="ctrl-btn" id="btnLeft">←</div>
        <div class="ctrl-btn" id="btnRight">→</div>
    </div>
    <div class="jump-btn" id="btnJump">跳跃</div>
</div>

<div class="btn-group">
    <a href="https://facaifu.github.io/" class="back">回到主页</a>
    <button class="restart" onclick="location.reload()">重新开始</button>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const groundY = canvas.height - 35;
const startBtn = document.getElementById("startBtn");

// 玩家
const player = {
    x:80,y:groundY-40,w:36,h:36,
    vx:0,vy:0,
    speed:6,
    gravity:0.6,jump:-14,onGround:true
};
let obsList = [];
let speed = 2.2;
let over = false;
let win = false;
let score = 0;
let gameStart = false;
let winCountdown = 0;
let winTimer = null;

// 按键状态
const keys = {
    left:false,
    right:false
};

// 跳跃逻辑
function jump(){
    // 游戏结束/胜利点击直接刷新重开
    if(over || win){
        location.reload();
        return;
    }
    if(gameStart && player.onGround){
        player.vy = player.jump;
        player.onGround = false;
    }
}

// 开始游戏
startBtn.onclick = function(){
    gameStart = true;
    startBtn.style.display = "none";
}

// 电脑键盘
document.addEventListener("keydown",e=>{
    if(e.code=="Space") jump();
    if(e.code=="KeyA") keys.left=true;
    if(e.code=="KeyD") keys.right=true;
});
document.addEventListener("keyup",e=>{
    if(e.code=="KeyA") keys.left=false;
    if(e.code=="KeyD") keys.right=false;
});
canvas.addEventListener('click', jump);
canvas.addEventListener('touchend',function(e){
    e.preventDefault();
    jump();
});

// 手机虚拟按键
const btnLeft = document.getElementById("btnLeft");
const btnRight = document.getElementById("btnRight");
const btnJump = document.getElementById("btnJump");
btnLeft.addEventListener('touchstart',e=>{e.preventDefault();keys.left=true;});
btnLeft.addEventListener('touchend',e=>{e.preventDefault();keys.left=false;});
btnRight.addEventListener('touchstart',e=>{e.preventDefault();keys.right=true;});
btnRight.addEventListener('touchend',e=>{e.preventDefault();keys.right=false;});
btnJump.addEventListener('touchstart',e=>{e.preventDefault();jump();});

// 生成障碍
function createObs(){
    obsList.push({x:canvas.width,y:groundY-46,w:28,h:46});
}

function run(){
    ctx.fillStyle="#0a0e27";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    // 地面
    ctx.fillStyle="#222850";
    ctx.fillRect(0,groundY,canvas.width,35);

    // 绘制玩家
    ctx.fillStyle="#8b5cf6";
    ctx.fillRect(player.x,player.y,player.w,player.h);

    if(gameStart && !over && !win){
        // 左右移动
        player.vx = 0;
        if(keys.left) player.vx = -player.speed;
        if(keys.right) player.vx = player.speed;
        player.x += player.vx;

        // 边界锁定
        if(player.x < 0) player.x = 0;
        if(player.x+player.w > canvas.width) player.x = canvas.width-player.w;

        // 重力
        player.vy += player.gravity;
        player.y += player.vy;
        if(player.y+player.h >= groundY){
            player.y = groundY-player.h;
            player.vy = 0;
            player.onGround = true;
        }

        // 生成障碍物
        if(Math.random()<0.0045) createObs();
        for(let i=obsList.length-1;i>=0;i--){
            let o = obsList[i];
            o.x -= speed;
            ctx.fillStyle="#e84444";
            ctx.fillRect(o.x,o.y,o.w,o.h);

            // 碰撞判定
            if(player.x<o.x+o.w && player.x+player.w>o.x && player.y<o.y+o.h && player.y+player.h>o.y){
                over = true;
            }
            if(o.x+o.w<0){
                obsList.splice(i,1);
                score +=10;
                if(score >= 70 && !win){
                    win = true;
                    winCountdown = 2;
                    // 倒计时跳转主页
                    winTimer = setInterval(()=>{
                        winCountdown -= 0.02;
                        if(winCountdown <= 0){
                            clearInterval(winTimer);
                            window.location.href = "https://facaifu.github.io/4/";
                        }
                    },20);
                }
            }
        }
    }else{
        // 未开始 / 结束，障碍静止
        for(let i=0;i<obsList.length;i++){
            let o = obsList[i];
            ctx.fillStyle="#e84444";
            ctx.fillRect(o.x,o.y,o.w,o.h);
        }
    }

    // 文字
    ctx.fillStyle="#fff";
    ctx.font="20px Microsoft YaHei";
    ctx.fillText("得分："+score,20,32);

    if(win){
        ctx.fillStyle="#4ade80";
        ctx.fillText(`🎉 胜利！！ohhhhhhh${winCountdown.toFixed(1)}秒后自动去一个地方`,canvas.width/2-210,canvas.height/2);
    }else if(over){
        ctx.fillText("游戏结束，点击画面重新开始",canvas.width/2-155,canvas.height/2);
    }
    requestAnimationFrame(run);
}
run();
</script>
</body>
</html>
